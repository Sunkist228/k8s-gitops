apiVersion: batch/v1
kind: Job
metadata:
  name: retire-legacy-apps-20261012
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: retire-legacy-apps-20261012
    spec:
      serviceAccountName: retire-legacy-apps-20261012
      restartPolicy: Never
      containers:
      - name: cleanup
        image: python:3.13.15-trixie
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -u
        - /cleanup/cleanup.py
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: script
          mountPath: /cleanup
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: retire-legacy-apps-20261012
