apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-stalwart-data
  labels:
    app.kubernetes.io/name: mail-stalwart
    app.kubernetes.io/part-of: platform-mail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-stalwart-config
  labels:
    app.kubernetes.io/name: mail-stalwart
    app.kubernetes.io/part-of: platform-mail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mail-stalwart
  labels:
    app.kubernetes.io/name: mail-stalwart
    app.kubernetes.io/part-of: platform-mail
    monitoring.devflux.io/enabled: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mail-stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: smtps
      port: 465
      targetPort: 465
    - name: submission
      port: 587
      targetPort: 587
    - name: imap
      port: 143
      targetPort: 143
    - name: imaps
      port: 993
      targetPort: 993
    - name: sieve
      port: 4190
      targetPort: 4190
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-stalwart-web-proxy
  labels:
    app.kubernetes.io/name: mail-stalwart-web-proxy
    app.kubernetes.io/part-of: platform-mail
data:
  default.conf: |
    server {
      listen 8080;
      server_name mail.devflux.ru;

      location = /metrics/prometheus {
        return 404;
      }

      location / {
        proxy_pass http://mail-stalwart:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-stalwart-web-proxy
  labels:
    app.kubernetes.io/name: mail-stalwart-web-proxy
    app.kubernetes.io/part-of: platform-mail
spec:
  replicas: 1
  minReadySeconds: 15
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail-stalwart-web-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-stalwart-web-proxy
        app.kubernetes.io/part-of: platform-mail
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /.well-known/jmap
              port: 8080
            failureThreshold: 60
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /.well-known/jmap
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: mail-stalwart-web-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: mail-stalwart-web-proxy
  labels:
    app.kubernetes.io/name: mail-stalwart-web-proxy
    app.kubernetes.io/part-of: platform-mail
spec:
  selector:
    app.kubernetes.io/name: mail-stalwart-web-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mail-stalwart
  labels:
    app.kubernetes.io/name: mail-stalwart
    app.kubernetes.io/part-of: platform-mail
spec:
  serviceName: mail-stalwart
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mail-stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-stalwart
        app.kubernetes.io/part-of: platform-mail
    spec:
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imap
              containerPort: 143
            - name: imaps
              containerPort: 993
            - name: sieve
              containerPort: 4190
            - name: https
              containerPort: 443
            - name: mgmt
              containerPort: 8080
          env:
            - name: STALWART_HOSTNAME
              value: mail.devflux.ru
            - name: STALWART_PUBLIC_URL
              value: https://mail.devflux.ru
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: mail-stalwart-secrets
                  key: STALWART_RECOVERY_ADMIN
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          volumeMounts:
            - name: mail-config
              mountPath: /etc/stalwart
            - name: mail-data
              mountPath: /var/lib/stalwart
            - name: mail-tls
              mountPath: /etc/stalwart/tls
              readOnly: true
      volumes:
        - name: mail-config
          persistentVolumeClaim:
            claimName: mail-stalwart-config
        - name: mail-data
          persistentVolumeClaim:
            claimName: mail-stalwart-data
        - name: mail-tls
          secret:
            secretName: mail-devflux-ru-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-stalwart
  labels:
    app.kubernetes.io/name: mail-stalwart
    app.kubernetes.io/part-of: platform-mail
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: public
  rules:
    - host: mail.devflux.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mail-stalwart-web-proxy
                port:
                  number: 8080
  tls:
    - hosts:
        - mail.devflux.ru
      secretName: mail-devflux-ru-tls
