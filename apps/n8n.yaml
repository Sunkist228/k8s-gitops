# ===================================================================
# 1. Пространство имен (Namespace) для изоляции n8n
# Лучше всего запускать приложения в отдельных неймспейсах.
# ===================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: n8n

---
# ===================================================================
# 2. Запрос на постоянное хранилище (PersistentVolumeClaim)
# Это КРАЙНЕ ВАЖНО для n8n. Без этого все ваши воркфлоу и
# учетные данные будут удалены при перезапуске пода.
# ===================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce # Стандартный режим доступа для диска
  resources:
    requests:
      storage: 5Gi # Запрашиваем 5 ГБ. Измените при необходимости.

---
# ===================================================================
# 3. Секрет для хранения пароля
# Хранить пароли в открытом виде в Deployment - плохая практика.
# Создаем секрет, который Deployment будет использовать.
# Пароль 'n8n' закодирован в Base64 -> 'bjhu'
# ===================================================================
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: n8n
type: Opaque
data:
  # echo -n '20172010Egor!' | base64
  N8N_BASIC_AUTH_PASSWORD: MjAxNzIwMTBFZ29yIQ==

---
# ===================================================================
# 4. Deployment (Развертывание) n8n
# Основа из вашего первого файла, дополненная переменными
# из второго и лучшими практиками.
# ===================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels: &n8nLabels # Используем YAML якорь для переиспользования лейблов
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels: *n8nLabels
  template:
    metadata:
      labels: *n8nLabels
    spec:
      # Контекст безопасности, чтобы контейнер не работал от root
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Toleration позволяет поду запускаться на control-plane нодах.
      # Если у вас стандартный кластер с выделенными worker-нодами,
      # эту секцию можно удалить.
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
          name: web
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: "n8n"
        - name: WEBHOOK_URL
          value: "https://n8n.devflux.ru/"
        - name: GENERIC_TIMEZONE
          value: "Europe/Moscow"
        - name: N8N_PROTOCOL
          value: "https"
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_BASIC_AUTH_PASSWORD
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc

---
# ===================================================================
# 5. Сервис (Service)
# Тип ClusterIP - правильный выбор, т.к. доступ будет идти
# через Ingress, а не напрямую.
# ===================================================================
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: n8n
spec:
  selector:
    app: n8n # Указывает на поды нашего Deployment
  ports:
  - port: 5678
    targetPort: web
    name: web

---
# ===================================================================
# 6. Ingress для доступа по доменному имени
# Взят из вашего первого файла, т.к. он настроен идеально
# для доступа извне с автоматическим получением SSL-сертификата.
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-ingress
  namespace: n8n
  annotations:
    # Указывает cert-manager выпустить SSL сертификат
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Разрешает загружать большие файлы в n8n
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    # Принудительно перенаправляет HTTP на HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: public
  rules:
  - host: n8n.devflux.ru # Ваш домен
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-service # Направляем трафик на наш сервис
            port:
              name: web
  tls:
  - hosts:
    - n8n.devflux.ru
    # cert-manager автоматически создаст этот секрет с сертификатом
    secretName: n8n-tls-secret