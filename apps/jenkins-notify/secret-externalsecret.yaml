apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-notify-secret
  annotations:
    force-sync: "2026-03-04T00:00:00Z"
  namespace: devops-tools
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: jenkins-notify-secret
    creationPolicy: Owner
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: devops-tools/jenkins-notify
        property: telegram-bot-token
    - secretKey: telegram-chat-id
      remoteRef:
        key: devops-tools/jenkins-notify
        property: telegram-chat-id
    - secretKey: api-keys
      remoteRef:
        key: devops-tools/jenkins-notify
        property: api-keys
