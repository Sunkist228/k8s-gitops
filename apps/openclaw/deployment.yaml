apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
      annotations:
        openclaw.gitops/restarted-at: "2026-02-27T22:20:00Z"
    spec:
      shareProcessNamespace: true
      initContainers:
        - name: gateway-token-init
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - /opt/scripts/init-gateway-token.sh
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node/.openclaw
            - name: scripts
              mountPath: /opt/scripts
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.2.26
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              TOKEN_FILE="/home/node/.openclaw/bootstrap/gateway-token"
              if [ ! -s "$TOKEN_FILE" ]; then
                echo "missing gateway token at $TOKEN_FILE" >&2
                exit 1
              fi
              TOKEN_FROM_FILE="$(cat "$TOKEN_FILE")"
              node dist/index.js config set gateway.controlUi.allowedOrigins "['https://openclaw.devflux.ru']" --json >/dev/null
              node dist/index.js config set channels.telegram.proxy "http://127.0.0.1:7890" >/dev/null
              node - <<'NODE'
              const fs = require("fs");

              const configPath = "/home/node/.openclaw/openclaw.json";
              const cfg = JSON.parse(fs.readFileSync(configPath, "utf8"));
              cfg.agents ??= {};
              cfg.agents.defaults ??= {};
              cfg.agents.defaults.model ??= {};
              cfg.agents.defaults.model.primary = "custom-api-omnirouter-devflux-ru/kr/claude-sonnet-4.5";
              cfg.agents.defaults.model.fallbacks = [];
              if (cfg.agents.defaults.models?.["anthropic/claude-opus-4-6"]) {
                delete cfg.agents.defaults.models["anthropic/claude-opus-4-6"];
              }
              fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2) + "\n");

              const modelsPath = "/home/node/.openclaw/agents/main/agent/models.json";
              if (!fs.existsSync(modelsPath)) {
                process.exit(0);
              }
              const models = JSON.parse(fs.readFileSync(modelsPath, "utf8"));
              const provider = models.providers?.["custom-api-omnirouter-devflux-ru"];
              if (provider) {
                provider.api = "openai-chat-completions";
                for (const model of provider.models ?? []) {
                  if (model.id === "kr/claude-sonnet-4.5") {
                    model.contextWindow = 200000;
                    model.maxTokens = 8192;
                    model.api = "openai-chat-completions";
                  }
                }
                fs.writeFileSync(modelsPath, JSON.stringify(models, null, 2) + "\n");
              }
              NODE
              exec node dist/index.js gateway --bind lan --port 18789 --token "$TOKEN_FROM_FILE"
          env:
            - name: HTTP_PROXY
              value: http://127.0.0.1:7890
            - name: HTTPS_PROXY
              value: http://127.0.0.1:7890
            - name: ALL_PROXY
              value: socks5://127.0.0.1:7891
            - name: NO_PROXY
              value: 127.0.0.1,localhost,.svc,.cluster.local
          ports:
            - name: gateway
              containerPort: 18789
          volumeMounts:
            - name: openclaw-data
              mountPath: /home/node/.openclaw
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN_FILE="/home/node/.openclaw/bootstrap/gateway-token"
                  [ -s "$TOKEN_FILE" ] && OPENCLAW_GATEWAY_TOKEN="$(cat "$TOKEN_FILE")" node dist/index.js health >/dev/null
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 15
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN_FILE="/home/node/.openclaw/bootstrap/gateway-token"
                  [ -s "$TOKEN_FILE" ] && OPENCLAW_GATEWAY_TOKEN="$(cat "$TOKEN_FILE")" node dist/index.js health >/dev/null
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN_FILE="/home/node/.openclaw/bootstrap/gateway-token"
                  [ -s "$TOKEN_FILE" ] && OPENCLAW_GATEWAY_TOKEN="$(cat "$TOKEN_FILE")" node dist/index.js health >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
        - name: mihomo
          image: metacubex/mihomo:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              CONFIG="/shared/mihomo/config.yaml"
              while [ ! -s "$CONFIG" ]; do
                echo "[mihomo] waiting for $CONFIG"
                sleep 2
              done
              if command -v mihomo >/dev/null 2>&1; then
                exec mihomo -f "$CONFIG"
              fi
              exec /mihomo -f "$CONFIG"
          ports:
            - name: http-proxy
              containerPort: 7890
            - name: socks-proxy
              containerPort: 7891
          volumeMounts:
            - name: shared-mihomo
              mountPath: /shared/mihomo
        - name: proxy-sync
          image: python:3.12-alpine
          command:
            - python
            - /opt/scripts/proxy-sync.py
          env:
            - name: SUBSCRIPTION_URL_FILE
              value: /vault-secrets/subscription_url
          volumeMounts:
            - name: shared-mihomo
              mountPath: /shared/mihomo
            - name: scripts
              mountPath: /opt/scripts
            - name: vpn-subscription
              mountPath: /vault-secrets
              readOnly: true
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: shared-mihomo
          emptyDir: {}
        - name: scripts
          configMap:
            name: openclaw-scripts
            defaultMode: 0555
        - name: vpn-subscription
          secret:
            secretName: openclaw-vpn-subscription
            optional: true
