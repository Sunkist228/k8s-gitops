apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-scripts
  namespace: openclaw
data:
  init-gateway-token.sh: |
    #!/bin/sh
    set -eu

    OPENCLAW_DIR="/home/node/.openclaw"
    BOOTSTRAP_DIR="$OPENCLAW_DIR/bootstrap"
    TOKEN_FILE="/home/node/.openclaw/bootstrap/gateway-token"
    TOKEN_DIR="$(dirname "$TOKEN_FILE")"
    APP_UID="${APP_UID:-1000}"
    APP_GID="${APP_GID:-1000}"

    mkdir -p "$TOKEN_DIR"
    chmod 755 "$OPENCLAW_DIR" "$BOOTSTRAP_DIR" 2>/dev/null || true
    chown "$APP_UID:$APP_GID" "$OPENCLAW_DIR" "$BOOTSTRAP_DIR" 2>/dev/null || true

    if [ -s "$TOKEN_FILE" ]; then
      chown "$APP_UID:$APP_GID" "$TOKEN_FILE" 2>/dev/null || true
      chmod 644 "$TOKEN_FILE" 2>/dev/null || true
      exit 0
    fi

    if command -v openssl >/dev/null 2>&1; then
      token="$(openssl rand -hex 32)"
    else
      token="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
    fi

    printf '%s' "$token" > "$TOKEN_FILE"
    chown "$APP_UID:$APP_GID" "$TOKEN_FILE" 2>/dev/null || true
    chmod 644 "$TOKEN_FILE" 2>/dev/null || true
  proxy-sync.py: |
    #!/usr/bin/env python3
    import base64
    import hashlib
    import os
    import re
    import signal
    import time
    from pathlib import Path
    from urllib.parse import parse_qs, unquote, urlparse
    from urllib.request import Request, urlopen

    OUTPUT_PATH = Path("/shared/mihomo/config.yaml")
    SUBSCRIPTION_FILE = Path(os.environ.get("SUBSCRIPTION_URL_FILE", "/vault-secrets/subscription_url"))
    GROUP_NAME = "OpenAI-Group"
    REFRESH_SECONDS = 21600
    FAILURE_RETRY_SECONDS = 60
    RU_MARKERS = (
        "🇷🇺",
        "russia",
        "russian",
        "moscow",
        "росси",
        "москва",
        "питер",
        "санкт",
    )


    def log(message: str) -> None:
        print(f"[proxy-sync] {message}", flush=True)


    def sanitize_subscription_url(value: str) -> str:
        text = value.strip()
        if not text:
            return ""
        if (text.startswith('"') and text.endswith('"')) or (text.startswith("'") and text.endswith("'")):
            text = text[1:-1].strip()
        return text


    def read_subscription_url() -> str:
        if SUBSCRIPTION_FILE.exists():
            raw = SUBSCRIPTION_FILE.read_text(encoding="utf-8", errors="replace")
            return sanitize_subscription_url(raw)
        return sanitize_subscription_url(os.environ.get("SUBSCRIPTION_URL", ""))


    def fetch_direct_subscription(subscription_url: str) -> str:
        request = Request(subscription_url, headers={"User-Agent": "openclaw-proxy-sync/1.0"})
        with urlopen(request, timeout=60) as response:
            content = response.read().decode("utf-8", errors="replace")
        if not content.strip():
            raise RuntimeError("subscription endpoint returned an empty response")
        return content


    def decode_base64_subscription(content: str) -> str:
        compact = "".join(content.split())
        if not compact:
            raise RuntimeError("empty subscription payload")
        padded = compact + ("=" * (-len(compact) % 4))
        decoded = base64.b64decode(padded).decode("utf-8", errors="replace")
        if not decoded.strip():
            raise RuntimeError("decoded subscription payload is empty")
        return decoded


    def yaml_quote(value: str) -> str:
        escaped = value.replace("\\", "\\\\").replace('"', '\\"')
        return f'"{escaped}"'


    def is_russian_proxy(name: str, server: str) -> bool:
        name_text = (name or "").lower()
        server_text = (server or "").lower()
        combined = f"{name_text} {server_text}"

        if any(marker in combined for marker in RU_MARKERS):
            return True

        # Common country code markers in labels/domains.
        if re.search(r"(^|[^a-z0-9])ru([^a-z0-9]|$)", combined):
            return True

        if server_text.startswith("ru.") or ".ru." in server_text or server_text.endswith(".ru"):
            return True

        return False


    def build_vless_proxy_item(link: str):
        parsed = urlparse(link)
        if parsed.scheme.lower() != "vless":
            return None
        if "@" not in parsed.netloc:
            return None

        uuid, hostport = parsed.netloc.split("@", 1)
        if ":" in hostport:
            server, port_raw = hostport.rsplit(":", 1)
        else:
            server, port_raw = hostport, "443"

        try:
            port = int(port_raw)
        except ValueError:
            return None

        query = parse_qs(parsed.query, keep_blank_values=True)
        name = unquote(parsed.fragment or f"{server}:{port}")

        item = [
            f"  - name: {yaml_quote(name)}",
            "    type: vless",
            f"    server: {yaml_quote(server)}",
            f"    port: {port}",
            f"    uuid: {yaml_quote(uuid)}",
            "    udp: true",
        ]

        network = (query.get("type", ["tcp"])[0] or "tcp").strip()
        item.append(f"    network: {yaml_quote(network)}")

        security = (query.get("security", [""])[0] or "").strip().lower()
        if security in ("tls", "reality"):
            item.append("    tls: true")

        sni = (query.get("sni", [""])[0] or "").strip()
        if sni:
            item.append(f"    servername: {yaml_quote(sni)}")

        flow = (query.get("flow", [""])[0] or "").strip()
        if flow:
            item.append(f"    flow: {yaml_quote(flow)}")

        if security == "reality":
            pbk = (query.get("pbk", [""])[0] or "").strip()
            sid = (query.get("sid", [""])[0] or "").strip()
            fp = (query.get("fp", [""])[0] or "").strip()
            if pbk:
                item.append("    reality-opts:")
                item.append(f"      public-key: {yaml_quote(pbk)}")
                if sid:
                    item.append(f"      short-id: {yaml_quote(sid)}")
            if fp:
                item.append(f"    client-fingerprint: {yaml_quote(fp)}")

        if is_russian_proxy(name, server):
            return None

        return item, name


    def parse_vless_subscription(content: str):
        decoded = decode_base64_subscription(content)
        links = [line.strip() for line in decoded.splitlines() if line.strip()]
        proxies = []
        names = []

        for link in links:
            proxy = build_vless_proxy_item(link)
            if proxy is None:
                continue
            item, name = proxy
            proxies.append("\n".join(item))
            names.append(name)

        if not proxies:
            raise RuntimeError("no supported vless nodes found in subscription payload")

        return "\n".join(proxies) + "\n", names


    def normalize_scalar(value: str) -> str:
        text = value.strip()
        if not text:
            return ""

        if text[0] in ('"', "'"):
            quote_char = text[0]
            if len(text) >= 2 and text[-1] == quote_char:
                return text[1:-1]
            return text[1:]

        if " #" in text:
            text = text.split(" #", 1)[0].rstrip()

        return text


    def split_proxy_items(proxy_lines):
        items = []
        current = []

        for line in proxy_lines:
            if line.startswith("  - "):
                if current:
                    items.append(current)
                current = [line]
                continue

            if current:
                current.append(line)

        if current:
            items.append(current)

        return items


    def extract_name_from_item(item_lines) -> str:
        first_line = item_lines[0].strip()

        match = re.match(r"^-\s*name\s*:\s*(.+)$", first_line)
        if match:
            return normalize_scalar(match.group(1))

        if first_line.startswith("- {"):
            inline_match = re.search(r"\bname\s*:\s*([^,}]+)", first_line)
            if inline_match:
                return normalize_scalar(inline_match.group(1))

        for line in item_lines[1:]:
            match = re.match(r"^\s*name\s*:\s*(.+)$", line)
            if match:
                return normalize_scalar(match.group(1))

        return ""


    def extract_server_from_item(item_lines) -> str:
        first_line = item_lines[0].strip()

        if first_line.startswith("- {"):
            inline_match = re.search(r"\bserver\s*:\s*([^,}]+)", first_line)
            if inline_match:
                return normalize_scalar(inline_match.group(1))

        for line in item_lines[1:]:
            match = re.match(r"^\s*server\s*:\s*(.+)$", line)
            if match:
                return normalize_scalar(match.group(1))

        return ""


    def extract_proxies_block_and_names(clash_yaml_text: str):
        lines = clash_yaml_text.splitlines()
        proxy_start = -1

        for index, line in enumerate(lines):
            if line.strip() == "proxies:":
                proxy_start = index
                break

        if proxy_start == -1:
            raise RuntimeError("no top-level 'proxies:' section found in converter output")

        proxy_lines = []
        for line in lines[proxy_start + 1 :]:
            if line.startswith(" ") or line.startswith("\t") or not line.strip():
                proxy_lines.append(line)
                continue
            break

        while proxy_lines and not proxy_lines[-1].strip():
            proxy_lines.pop()

        if not proxy_lines:
            raise RuntimeError("converter returned an empty 'proxies:' block")

        proxy_items = split_proxy_items(proxy_lines)
        if not proxy_items:
            raise RuntimeError("unable to parse proxy items from converter output")

        filtered_items = []
        proxy_names = []
        for item in proxy_items:
            name = extract_name_from_item(item)
            server = extract_server_from_item(item)
            if not name:
                continue
            if is_russian_proxy(name, server):
                continue
            filtered_items.append(item)
            proxy_names.append(name)

        if not proxy_names:
            raise RuntimeError("no non-RU proxies found in converter output")

        rendered = []
        for item in filtered_items:
            rendered.extend(item)
        proxy_block = "\n".join(rendered) + "\n"
        return proxy_block, proxy_names


    def build_mihomo_config(proxy_block: str, proxy_names) -> str:
        proxy_group_entries = "\n".join(f"      - {yaml_quote(name)}" for name in proxy_names)

        return (
            "port: 7890\n"
            "socks-port: 7891\n"
            "allow-lan: true\n"
            "mode: rule\n"
            "log-level: info\n"
            "proxies:\n"
            f"{proxy_block}"
            "proxy-groups:\n"
            f"  - name: {GROUP_NAME}\n"
            "    type: url-test\n"
            "    proxies:\n"
            f"{proxy_group_entries}\n"
            "    url: http://www.gstatic.com/generate_204\n"
            "    interval: 300\n"
            "rules:\n"
            f"  - DOMAIN-SUFFIX,openai.com,{GROUP_NAME}\n"
            f"  - DOMAIN-SUFFIX,anthropic.com,{GROUP_NAME}\n"
            "  - GEOIP,CN,DIRECT\n"
            f"  - MATCH,{GROUP_NAME}\n"
        )


    def sha256_text(content: str) -> str:
        return hashlib.sha256(content.encode("utf-8")).hexdigest()


    def read_existing_hash(path: Path):
        if not path.exists():
            return None
        return sha256_text(path.read_text(encoding="utf-8"))


    def write_atomic(path: Path, content: str) -> None:
        path.parent.mkdir(parents=True, exist_ok=True)
        temp_path = path.with_suffix(path.suffix + ".tmp")
        temp_path.write_text(content, encoding="utf-8")
        os.replace(temp_path, path)


    def find_mihomo_pids():
        pids = set()
        proc_root = Path("/proc")

        for entry in proc_root.iterdir():
            if not entry.name.isdigit():
                continue

            try:
                comm = (entry / "comm").read_text(encoding="utf-8").strip().lower()
                if "mihomo" in comm:
                    pids.add(int(entry.name))
                    continue

                cmdline_raw = (entry / "cmdline").read_bytes()
                cmdline = cmdline_raw.replace(b"\x00", b" ").decode("utf-8", errors="ignore").lower()
                if "mihomo" in cmdline:
                    pids.add(int(entry.name))
            except OSError:
                continue

        return sorted(pids)


    def reload_mihomo() -> None:
        pids = find_mihomo_pids()
        if not pids:
            log("mihomo process not found yet; config written without reload signal")
            return

        for pid in pids:
            try:
                os.kill(pid, signal.SIGHUP)
                log(f"sent SIGHUP to mihomo process pid={pid}")
            except ProcessLookupError:
                continue


    def sync_once(subscription_url: str) -> bool:
        raw_content = fetch_direct_subscription(subscription_url)
        try:
            proxy_block, proxy_names = extract_proxies_block_and_names(raw_content)
        except RuntimeError:
            log("direct payload is not clash yaml; trying base64 vless parser")
            proxy_block, proxy_names = parse_vless_subscription(raw_content)

        final_config = build_mihomo_config(proxy_block, proxy_names)

        new_hash = sha256_text(final_config)
        old_hash = read_existing_hash(OUTPUT_PATH)

        if old_hash == new_hash:
            log("config unchanged; skipping write")
            return False

        write_atomic(OUTPUT_PATH, final_config)
        log(f"config updated with {len(proxy_names)} proxies")
        reload_mihomo()
        return True


    def main() -> int:
        log("starting proxy sync loop")
        OUTPUT_PATH.parent.mkdir(parents=True, exist_ok=True)

        while True:
            try:
                subscription_url = read_subscription_url()
                if not subscription_url:
                    raise RuntimeError(
                        f"subscription URL is empty; expected secret file at {SUBSCRIPTION_FILE}"
                    )
                sync_once(subscription_url)
                time.sleep(REFRESH_SECONDS)
            except Exception as error:  # noqa: BLE001
                log(f"sync failed: {error}")
                time.sleep(FAILURE_RETRY_SECONDS)


    if __name__ == "__main__":
        raise SystemExit(main())
