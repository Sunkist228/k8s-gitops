apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: obsidian-sync
  labels:
    app: obsidian-sync
    environment: prod
    component: couchdb
data:
  obsidian.ini: |
    [couchdb]
    single_node = true
    max_document_size = 50000000

    [cluster]
    n = 1
    q = 8

    [chttpd]
    bind_address = 0.0.0.0
    port = 5984
    require_valid_user = true
    require_valid_user_except_for_up = true
    enable_cors = true
    max_http_request_size = 4294967296

    [chttpd_auth]
    require_valid_user = true

    [httpd]
    enable_cors = true
    WWW-Authenticate = Basic realm="couchdb"

    [cors]
    credentials = true
    origins = app://obsidian.md,capacitor://localhost,http://localhost,https://notes.devflux.ru
    methods = GET,POST,PUT,DELETE,HEAD,OPTIONS
    headers = accept,authorization,content-type,origin,referer,x-couchdb-warn,x-requested-with

    [log]
    level = info
