apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb-credentials
  namespace: obsidian-sync
  labels:
    app: obsidian-sync
    environment: prod
    component: couchdb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: couchdb-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: databases/obsidian-sync
        property: COUCHDB_USER
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: databases/obsidian-sync
        property: COUCHDB_PASSWORD
    - secretKey: COUCHDB_SECRET
      remoteRef:
        key: databases/obsidian-sync
        property: COUCHDB_SECRET
    - secretKey: OBSIDIAN_DB
      remoteRef:
        key: databases/obsidian-sync
        property: OBSIDIAN_DB
    - secretKey: OBSIDIAN_USER
      remoteRef:
        key: databases/obsidian-sync
        property: OBSIDIAN_USER
    - secretKey: OBSIDIAN_PASSWORD
      remoteRef:
        key: databases/obsidian-sync
        property: OBSIDIAN_PASSWORD
    - secretKey: AI_READER_USER
      remoteRef:
        key: databases/obsidian-sync
        property: AI_READER_USER
    - secretKey: AI_READER_PASSWORD
      remoteRef:
        key: databases/obsidian-sync
        property: AI_READER_PASSWORD
    - secretKey: AI_WRITER_USER
      remoteRef:
        key: databases/obsidian-sync
        property: AI_WRITER_USER
    - secretKey: AI_WRITER_PASSWORD
      remoteRef:
        key: databases/obsidian-sync
        property: AI_WRITER_PASSWORD
