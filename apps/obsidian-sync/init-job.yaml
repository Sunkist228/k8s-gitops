apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-init-scripts
  namespace: obsidian-sync
  labels:
    app: obsidian-sync
    environment: prod
    component: init
data:
  init_couchdb.py: |
    import base64
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    url = os.environ["COUCHDB_URL"].rstrip("/")
    admin_user = os.environ["COUCHDB_USER"]
    admin_password = os.environ["COUCHDB_PASSWORD"]
    obsidian_db = os.environ["OBSIDIAN_DB"]
    obsidian_user = os.environ["OBSIDIAN_USER"]
    obsidian_password = os.environ["OBSIDIAN_PASSWORD"]
    ai_reader_user = os.environ["AI_READER_USER"]
    ai_reader_password = os.environ["AI_READER_PASSWORD"]
    ai_writer_user = os.environ["AI_WRITER_USER"]
    ai_writer_password = os.environ["AI_WRITER_PASSWORD"]

    def reject_placeholder(name, value, min_length=1):
        if not value or value.startswith("${") or "REPLACE" in value or "CHANGE_ME" in value:
            raise SystemExit(f"{name} is not configured")
        if min_length and len(value) < min_length:
            raise SystemExit(f"{name} is too short")

    for name, value, min_length in [
        ("COUCHDB_USER", admin_user, 1),
        ("COUCHDB_PASSWORD", admin_password, 20),
        ("OBSIDIAN_DB", obsidian_db, 1),
        ("OBSIDIAN_USER", obsidian_user, 1),
        ("OBSIDIAN_PASSWORD", obsidian_password, 20),
        ("AI_READER_USER", ai_reader_user, 1),
        ("AI_READER_PASSWORD", ai_reader_password, 20),
        ("AI_WRITER_USER", ai_writer_user, 1),
        ("AI_WRITER_PASSWORD", ai_writer_password, 20),
    ]:
        reject_placeholder(name, value, min_length)

    token = base64.b64encode(f"{admin_user}:{admin_password}".encode()).decode()

    def request(method, path, body=None, ok=(200, 201, 202, 304, 409)):
        data = None
        headers = {
            "Authorization": f"Basic {token}",
            "Accept": "application/json",
        }
        if body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(f"{url}{path}", data=data, method=method, headers=headers)
        try:
            with urllib.request.urlopen(req, timeout=20) as res:
                payload = res.read()
                if payload:
                    return res.status, json.loads(payload.decode())
                return res.status, {}
        except urllib.error.HTTPError as exc:
            payload = exc.read().decode() if exc.fp else ""
            if exc.code in ok:
                return exc.code, json.loads(payload) if payload else {}
            raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {payload}") from exc

    for attempt in range(60):
        try:
            status, payload = request("GET", "/_up", ok=(200,))
            if payload.get("status") == "ok":
                break
        except Exception as exc:
            if attempt == 59:
                raise
            print(f"Waiting for CouchDB: {exc}", flush=True)
        time.sleep(5)

    def db_path(db_name):
        return "/" + urllib.parse.quote(db_name, safe="")

    for db in ["_users", "_replicator", "_global_changes", obsidian_db]:
        status, payload = request("PUT", db_path(db), ok=(201, 202, 409, 412))
        if status in (409, 412):
            print(f"Database {db} already exists", flush=True)
        else:
            print(f"Database {db} created", flush=True)

    def upsert_user(username, password, roles):
        user_id = f"org.couchdb.user:{username}"
        path = db_path("_users") + "/" + urllib.parse.quote(user_id, safe="")
        _, existing = request("GET", path, ok=(200, 404))
        doc = {
            "_id": user_id,
            "name": username,
            "type": "user",
            "roles": roles,
            "password": password,
        }
        if existing.get("_rev"):
            doc["_rev"] = existing["_rev"]
        request("PUT", path, doc, ok=(200, 201, 202))
        print(f"User {username} ensured", flush=True)

    upsert_user(obsidian_user, obsidian_password, ["obsidian-sync-writer"])
    upsert_user(ai_reader_user, ai_reader_password, ["obsidian-sync-reader"])
    upsert_user(ai_writer_user, ai_writer_password, ["obsidian-sync-writer"])

    security = {
        "admins": {"names": [admin_user], "roles": []},
        "members": {
            "names": [obsidian_user, ai_reader_user, ai_writer_user],
            "roles": ["obsidian-sync-reader", "obsidian-sync-writer"],
        },
    }
    request("PUT", db_path(obsidian_db) + "/_security", security, ok=(200, 201, 202))
    print(f"Security object ensured for {obsidian_db}", flush=True)

    validation_doc_id = "_design/authz"
    validation_path = db_path(obsidian_db) + "/" + urllib.parse.quote(validation_doc_id, safe="")
    _, existing_design = request("GET", validation_path, ok=(200, 404))
    ai_reader_literal = json.dumps(ai_reader_user)
    validation_doc = {
        "_id": validation_doc_id,
        "language": "javascript",
        "validate_doc_update": (
            "function(newDoc, oldDoc, userCtx, secObj) {"
            "  if (userCtx.roles.indexOf('_admin') !== -1) { return; }"
            f"  if (userCtx.name === {ai_reader_literal}) {{ throw({{forbidden: 'read-only user'}}); }}"
            "}"
        ),
    }
    if existing_design.get("_rev"):
        validation_doc["_rev"] = existing_design["_rev"]
    request("PUT", validation_path, validation_doc, ok=(200, 201, 202))
    print("Read-only validation design document ensured", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: couchdb-init
  namespace: obsidian-sync
  labels:
    app: obsidian-sync
    environment: prod
    component: init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: obsidian-sync
        environment: prod
        component: init
        obsidian-sync-access: "true"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-couchdb
          image: docker.io/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /scripts/init_couchdb.py
          env:
            - name: COUCHDB_URL
              value: http://couchdb:5984
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: COUCHDB_PASSWORD
            - name: OBSIDIAN_DB
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: OBSIDIAN_DB
            - name: OBSIDIAN_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: OBSIDIAN_USER
            - name: OBSIDIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: OBSIDIAN_PASSWORD
            - name: AI_READER_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: AI_READER_USER
            - name: AI_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: AI_READER_PASSWORD
            - name: AI_WRITER_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: AI_WRITER_USER
            - name: AI_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-credentials
                  key: AI_WRITER_PASSWORD
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: scripts
          configMap:
            name: couchdb-init-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
