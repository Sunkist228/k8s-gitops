apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb-secret
  annotations:
    force-sync: "2026-03-04T00:00:00Z"
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: couchdb-secret
    creationPolicy: Owner
  data:
    - secretKey: COUCHDB_USER
      remoteRef:
        key: databases/couchdb
        property: COUCHDB_USER
    - secretKey: COUCHDB_PASSWORD
      remoteRef:
        key: databases/couchdb
        property: COUCHDB_PASSWORD
