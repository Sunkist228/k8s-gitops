apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      annotations:
        home-assistant.devflux.io/restart-trigger: "2026-04-29-02"
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: fix-config-permissions
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /config && chmod -R 755 /config"]
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
      - name: config-trusted-proxies
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        image: busybox:1.36
        command: ["sh", "/scripts/trusted_proxies.sh"]
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
        - name: config-scripts
          mountPath: /scripts
          readOnly: true
      - name: render-pc-power-package
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        image: ghcr.io/home-assistant/home-assistant:stable
        command: ["sh", "/scripts/render_pc_power.sh"]
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
        - name: config-scripts
          mountPath: /scripts
          readOnly: true
        - name: pc-power-secret
          mountPath: /secrets
          readOnly: true
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
        ports:
        - containerPort: 8123
          name: web
        env:
        - name: TZ
          value: "Europe/Moscow"
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
      volumes:
      - name: home-assistant-config
        persistentVolumeClaim:
          claimName: home-assistant-pvc
      - name: config-scripts
        configMap:
          name: home-assistant-http-config
      - name: pc-power-secret
        secret:
          secretName: home-assistant-pc-power-secret
          optional: true
