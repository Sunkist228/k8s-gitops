apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: config-trusted-proxies
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        image: busybox:1.36
        command: ["sh", "/scripts/trusted_proxies.sh"]
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
        - name: config-scripts
          mountPath: /scripts
          readOnly: true
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
        - containerPort: 8123
          name: web
        env:
        - name: TZ
          value: "Europe/Moscow"
        volumeMounts:
        - name: home-assistant-config
          mountPath: /config
      volumes:
      - name: home-assistant-config
        persistentVolumeClaim:
          claimName: home-assistant-pvc
      - name: config-scripts
        configMap:
          name: home-assistant-http-config
