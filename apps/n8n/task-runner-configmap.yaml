apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-task-runner-config
  namespace: n8n
data:
  n8n-task-runners.json: |
    {
      "task-runners": [
        {
          "runner-type": "javascript",
          "env-overrides": {}
        },
        {
          "runner-type": "python",
          "env-overrides": {
            "PYTHONPATH": "/opt/custom-python:/opt/runners/task-runner-python",
            "N8N_RUNNERS_EXTERNAL_ALLOW": "Crypto,pycryptodome"
          }
        }
      ]
    }
