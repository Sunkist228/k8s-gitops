apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-dex
  labels:
    app.kubernetes.io/name: outline
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: outline
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline
        app.kubernetes.io/component: identity
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1-alpine
          imagePullPolicy: IfNotPresent
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: data
              mountPath: /var/dex
          startupProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /dex/.well-known/openid-configuration
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            secretName: outline-secrets
            items:
              - key: DEX_CONFIG
                path: config.yaml
        - name: data
          persistentVolumeClaim:
            claimName: outline-dex-data
---
apiVersion: v1
kind: Service
metadata:
  name: outline-dex
  labels:
    app.kubernetes.io/name: outline
    app.kubernetes.io/component: identity
spec:
  selector:
    app.kubernetes.io/name: outline
    app.kubernetes.io/component: identity
  ports:
    - name: http
      port: 5556
      targetPort: http
