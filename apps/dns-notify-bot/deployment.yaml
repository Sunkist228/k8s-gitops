apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-notify-bot
  labels:
    app: dns-notify-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns-notify-bot
  template:
    metadata:
      labels:
        app: dns-notify-bot
    spec:
      containers:
      - name: bot
        image: harbor.devflux.ru/bots/dns-notify-bot:12
        imagePullPolicy: Always
        env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: BOT_TOKEN
              name: dns-notify-bot-secret
        - name: ALLOWED_USER_IDS
          valueFrom:
            secretKeyRef:
              key: ALLOWED_USER_IDS
              name: dns-notify-bot-secret
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              key: DB_URL
              name: dns-notify-bot-secret
        - name: APP_VERSION
          value: "1.0.0"
        - name: LOG_LEVEL
          value: INFO
        - name: DNS_CHECK_INTERVAL_SEC
          value: "120"
        - name: SERVICE_CHECK_INTERVAL_SEC
          value: "300"
        - name: SCHEDULER_TICK_SEC
          value: "10"
        - name: HTTP_TIMEOUT_SEC
          value: "10"
        - name: METRICS_INTERVAL_SEC
          value: "300"
        - name: DISABLE_DEFAULT_SERVICES
          value: "0"
        - name: IMPORT_LEGACY_ON_EMPTY_DB
          value: "0"
        - name: DISABLE_STARTUP_NOTIFICATION
          value: "0"
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
