apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-server-config
  labels:
    app: artifact-server
    component: artifacts
    environment: dev
data:
  AUTO_CREATE_TABLES: "false"
  RUN_DB_MIGRATIONS: "true"
  S3_ARTIFACT_BUCKET: "devflux-artifacts-dev"
  S3_REGION: "us-east-1"
  S3_PUBLIC_ENDPOINT_URL: "https://minio.s3.devflux.ru"
  S3_PRESIGNED_DOWNLOAD_TTL_SECONDS: "600"
  PUBLIC_BASE_URL: "https://artifacts-dev.devflux.ru"
  MAX_UPLOAD_SIZE_BYTES: "524288000"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  REDIS_ENABLED: "true"
  LOG_LEVEL: "DEBUG"
