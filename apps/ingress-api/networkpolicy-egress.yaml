apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-manager-to-databases
  namespace: devops-tools
spec:
  podSelector:
    matchLabels:
      app: ingress-manager-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: databases
      podSelector:
        matchLabels:
          app: postgres
    - ipBlock:
        cidr: 10.152.183.236/32
    ports:
    - protocol: TCP
      port: 5432
