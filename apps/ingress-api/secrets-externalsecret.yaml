apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-manager-secret
  annotations:
    force-sync: "2026-03-04T00:00:00Z"
  namespace: devops-tools
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ingress-manager-secret
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: devops-tools/ingress-manager
        property: API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-manager-db
  annotations:
    force-sync: "2026-03-04T00:00:00Z"
  namespace: devops-tools
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ingress-manager-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: devops-tools/ingress-manager
        property: DATABASE_URL
