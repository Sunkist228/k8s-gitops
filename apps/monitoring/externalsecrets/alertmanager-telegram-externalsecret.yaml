apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-secret
  annotations:
    force-sync: "2026-03-04T00:00:00Z"
  namespace: monitoring
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-telegram-secret
    creationPolicy: Owner
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: monitoring/alertmanager-telegram
        property: telegram-bot-token
    - secretKey: telegram-chat-id
      remoteRef:
        key: monitoring/alertmanager-telegram
        property: telegram-chat-id
