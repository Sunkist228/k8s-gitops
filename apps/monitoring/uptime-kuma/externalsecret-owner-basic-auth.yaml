apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-owner-basic-auth
  namespace: monitoring
  labels:
    app: uptime-kuma
    environment: monitoring
    component: owner-dashboard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: uptime-kuma-owner-basic-auth
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef:
        key: secret/monitoring/uptime-kuma
        property: OWNER_BASIC_AUTH_HTPASSWD
