prometheus:
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - prometheus.k8s.devflux.ru
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: prometheus-tls-secret
        hosts:
          - prometheus.k8s.devflux.ru
  prometheusSpec:
    externalUrl: https://prometheus.k8s.devflux.ru
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  tplConfig: true
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - alertmanager.k8s.devflux.ru
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls-secret
        hosts:
          - alertmanager.k8s.devflux.ru
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    secrets:
      - alertmanager-telegram-secret
  templateFiles:
    telegram.tmpl: |-
      {{ define "telegram.default.message" }}
      <b>{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}</b>
      Severity: <b>{{ .CommonLabels.severity }}</b>
      Total: firing={{ len .Alerts.Firing }}, resolved={{ len .Alerts.Resolved }}
      {{- with .CommonAnnotations.summary }}
      Summary: {{ . }}
      {{- end }}
      {{- with (index .CommonAnnotations "runbook_url") }}
      Runbook: {{ . }}
      {{- end }}

      {{- if gt (len .Alerts.Firing) 0 }}
      <b>Firing instances:</b>
      {{- range .Alerts.Firing }}
      - ns=<code>{{ .Labels.namespace }}</code>, pod=<code>{{ .Labels.pod }}</code>{{- with .Labels.container }}, container=<code>{{ . }}</code>{{- end }}
        {{- with .Annotations.summary }} {{ . }}{{ else }} {{ .Annotations.description }}{{ end }}
      {{- end }}
      {{- end }}

      Prometheus: https://prometheus.k8s.devflux.ru/alerts
      Grafana: https://grafana.k8s.devflux.ru/alerting/list
      {{ end }}
  stringConfig: |
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram-monitoring
      group_by:
        - alertname
        - severity
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h
    receivers:
      - name: telegram-monitoring
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-secret/telegram-bot-token
            chat_id: 1320865933
            parse_mode: HTML
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl

grafana:
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.k8s.devflux.ru
    path: /
    tls:
      - secretName: grafana-tls-secret
        hosts:
          - grafana.k8s.devflux.ru
  grafana.ini:
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring

defaultRules:
  create: true
