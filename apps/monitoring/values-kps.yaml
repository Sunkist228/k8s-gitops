prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - alertmanager.k8s.devflux.ru
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls-secret
        hosts:
          - alertmanager.k8s.devflux.ru
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    secrets:
      - alertmanager-telegram-secret
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram-monitoring
      group_by:
        - alertname
        - namespace
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
      - name: telegram-monitoring
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-secret/telegram-bot-token
            chat_id: 123456789
            parse_mode: Markdown
            send_resolved: true

grafana:
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: public
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.k8s.devflux.ru
    path: /
    tls:
      - secretName: grafana-tls-secret
        hosts:
          - grafana.k8s.devflux.ru
  grafana.ini:
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring

defaultRules:
  create: true
