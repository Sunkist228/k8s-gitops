apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager-smoke-test
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: smoke-test
      rules:
        - alert: AlertmanagerSmokeTest
          expr: vector(1)
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "Alertmanager smoke test firing"
            description: "This is a temporary GitOps smoke test alert. It should be delivered to Telegram."
