apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-playerok-dev
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app: playerok
data:
  playerok-dev.json: |
    {
      "title": "Playerok Devflux Operations",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "tags": ["playerok", "playerok-dev", "operations"],
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "custom",
            "query": "playerok-dev",
            "current": {"selected": true, "text": "playerok-dev", "value": "playerok-dev"},
            "hide": 0
          },
          {
            "name": "service",
            "type": "custom",
            "query": "backend,artifact-server",
            "includeAll": true,
            "multi": true,
            "allValue": "backend|artifact-server",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "hide": 0
          },
          {
            "name": "workload",
            "type": "custom",
            "query": "frontend,backend,artifact-server",
            "includeAll": true,
            "multi": true,
            "allValue": "frontend|backend|artifact-server",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Service Health",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum by (service) (up{namespace=\"$namespace\", service=~\"$service\"}) or vector(0)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}
        },
        {
          "id": 2,
          "title": "Request Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])) or vector(0)",
              "legendFormat": "rps",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 3,
          "title": "Error Ratio by Service",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\", status=~\"5..\"}[$__rate_interval])) / clamp_min(sum by (service) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])), 1)",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.02}, {"color": "red", "value": 0.05}]}}}
        },
        {
          "id": 4,
          "title": "Firing Playerok Alerts",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "count(ALERTS{alertname=~\"Playerok.*\", alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "firing",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 3}]}}}
        },
        {
          "id": 5,
          "title": "Latency p50/p95/p99",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}} p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (service, le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}} p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 6,
          "title": "HTTP Requests by Handler",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "topk(10, sum by (service, handler, method) (rate(http_requests_total{namespace=\"$namespace\", service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}} {{method}} {{handler}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 7,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", pod=~\"($workload).*\", container!=\"\", image!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "cores"}}
        },
        {
          "id": 8,
          "title": "Memory Usage by Pod",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", pod=~\"($workload).*\", container!=\"\", image!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 9,
          "title": "Deployment Availability",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum by (deployment) (kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=~\"$workload\"})",
              "legendFormat": "{{deployment}} available",
              "refId": "A"
            },
            {
              "expr": "sum by (deployment) (kube_deployment_status_replicas_unavailable{namespace=\"$namespace\", deployment=~\"$workload\"})",
              "legendFormat": "{{deployment}} unavailable",
              "refId": "B"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 10,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\", pod=~\"($workload).*\"}[$__rate_interval]))",
              "legendFormat": "{{pod}} {{container}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 11,
          "title": "Artifact Downloads",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 28},
          "targets": [
            {
              "expr": "sum by (slug, platform, arch, mode) (rate(artifact_download_total{namespace=\"$namespace\", service=\"artifact-server\"}[$__rate_interval]))",
              "legendFormat": "{{slug}} {{platform}}/{{arch}} {{mode}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 12,
          "title": "Artifact Upload Results",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 28},
          "targets": [
            {
              "expr": "sum by (slug, platform, arch, result) (rate(artifact_upload_total{namespace=\"$namespace\", service=\"artifact-server\"}[$__rate_interval]))",
              "legendFormat": "{{slug}} {{platform}}/{{arch}} {{result}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 13,
          "title": "Artifact Storage Errors",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 28},
          "targets": [
            {
              "expr": "sum by (operation) (increase(artifact_storage_error_total{namespace=\"$namespace\", service=\"artifact-server\"}[$__rate_interval]))",
              "legendFormat": "{{operation}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 14,
          "title": "Artifact Promotions",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 36},
          "targets": [
            {
              "expr": "sum by (slug, channel, platform, arch, result) (rate(artifact_promote_total{namespace=\"$namespace\", service=\"artifact-server\"}[$__rate_interval]))",
              "legendFormat": "{{slug}} {{channel}} {{platform}}/{{arch}} {{result}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 15,
          "title": "Active Alert Details",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 36},
          "targets": [
            {
              "expr": "ALERTS{alertname=~\"Playerok.*\", alertstate=\"firing\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ],
      "annotations": {"list": []}
    }
