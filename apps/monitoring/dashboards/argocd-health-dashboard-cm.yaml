apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  argocd-health.json: |
    {
      "title": "ArgoCD Health Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Applications by Health",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (health_status) (argocd_app_info)",
              "legendFormat": "{{health_status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Applications by Sync Status",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "sum by (sync_status) (argocd_app_info)",
              "legendFormat": "{{sync_status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "OutOfSync / Degraded Apps",
          "type": "table",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "argocd_app_info{sync_status!=\"Synced\"} or argocd_app_info{health_status=\"Degraded\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Sync Operations (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum by (phase) (rate(argocd_app_sync_total[5m]))",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Top Namespaces with Non-Synced Apps",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "topk(10, sum by (namespace) (argocd_app_info{sync_status!=\"Synced\"}))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": { "list": [] },
      "annotations": { "list": [] }
    }
