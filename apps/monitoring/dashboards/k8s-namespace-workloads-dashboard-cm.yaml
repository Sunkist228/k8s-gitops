apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-namespace-workloads
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-namespace-workloads.json: |
    {
      "title": "Kubernetes Namespace Workloads",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(kube_pod_info, namespace)",
            "multi": false,
            "includeAll": false,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Deployments: Desired vs Available",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (deployment) (kube_deployment_spec_replicas{namespace=\"$namespace\"})",
              "legendFormat": "desired {{deployment}}",
              "refId": "A"
            },
            {
              "expr": "sum by (deployment) (kube_deployment_status_replicas_available{namespace=\"$namespace\"})",
              "legendFormat": "available {{deployment}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pods by Phase",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum by (phase) (kube_pod_status_phase{namespace=\"$namespace\"})",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Containers Waiting",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_waiting{namespace=\"$namespace\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Top Pods by CPU (cores)",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",image!=\"\"}[5m])))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Top Pods by Memory (MiB)",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "topk(10, sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",image!=\"\"}) / 1024 / 1024)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Container Restarts (Top 20)",
          "type": "table",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "topk(20, sum by (pod, container) (kube_pod_container_status_restarts_total{namespace=\"$namespace\"}))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ],
      "annotations": { "list": [] }
    }
