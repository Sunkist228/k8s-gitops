# Pre-dev contour: core deployment (namespace playerok-pre-dev)
# Core-only environment — no DB, no frontend/backend.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: playerok-pre-dev
  labels:
    app: core
    environment: pre-dev
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core
      environment: pre-dev
  template:
    metadata:
      annotations:
        gitops.devflux.io/restarted-at: "2026-03-04T00:10:00Z"
      labels:
        app: core
        environment: pre-dev
        component: core
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: core
          image: harbor.devflux.ru/playerok-devflux/core-pre-dev:v0.36.4-pre.14-sha.87d0709437b7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CORE_DATA_DIR
              value: /data
            - name: CORE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: playerok-secrets
                  key: TOTP_ENCRYPTION_KEY
            - name: CORE_API_HOST
              value: "0.0.0.0"
            - name: CORE_API_PORT
              value: "8765"
            - name: BACKEND_URL
              value: "http://backend:8000"
          volumeMounts:
            - name: core-data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: core-data
          emptyDir: {}
