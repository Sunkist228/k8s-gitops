# Pre-dev: frontend service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    environment: pre-dev
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: frontend
    environment: pre-dev
