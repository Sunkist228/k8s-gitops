# Pre-dev: backend config (same as dev, ENVIRONMENT=pre-dev)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    environment: pre-dev
    component: api
data:
  AUTO_CREATE_TABLES: "true"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRES_MINUTES: "30"
  REFRESH_TOKEN_EXPIRES_DAYS: "7"
  DB_CONNECT_RETRIES: "30"
  DB_CONNECT_DELAY_SECONDS: "5"
  ENVIRONMENT: "pre-dev"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
