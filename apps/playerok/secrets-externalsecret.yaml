apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playerok-secrets
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: playerok-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: playerok/playerok
        property: JWT_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: playerok/playerok
        property: DATABASE_URL
    - secretKey: TOTP_ISSUER
      remoteRef:
        key: playerok/playerok
        property: TOTP_ISSUER
    - secretKey: TOTP_ENCRYPTION_KEY
      remoteRef:
        key: playerok/playerok
        property: TOTP_ENCRYPTION_KEY
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: playerok/playerok
        property: S3_ENDPOINT_URL
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: playerok/playerok
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: playerok/playerok
        property: S3_SECRET_KEY
    - secretKey: S3_AVATAR_BUCKET
      remoteRef:
        key: playerok/playerok
        property: S3_AVATAR_BUCKET
    - secretKey: S3_AVATAR_PUBLIC_BASE_URL
      remoteRef:
        key: playerok/playerok
        property: S3_AVATAR_PUBLIC_BASE_URL
    - secretKey: CDN_ORIGIN_SECRET
      remoteRef:
        key: playerok/playerok
        property: CDN_ORIGIN_SECRET
    - secretKey: SMTP_HOST
      remoteRef:
        key: playerok/playerok
        property: SMTP_HOST
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: playerok/playerok
        property: SMTP_USERNAME
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: playerok/playerok
        property: SMTP_PASSWORD
