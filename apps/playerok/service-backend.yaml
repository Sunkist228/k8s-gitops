apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    environment: prod
    component: api
    monitoring.devflux.io/enabled: "true"
spec:
  selector:
    app: backend
    environment: prod
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
