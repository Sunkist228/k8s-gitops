apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker
  labels:
    app: email-worker
    environment: prod
    component: worker
spec:
  # Activate only after the production database, Vault values and mailbox are verified.
  replicas: 0
  selector:
    matchLabels:
      app: email-worker
      environment: prod
  template:
    metadata:
      labels:
        app: email-worker
        environment: prod
        component: worker
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: email-worker
          image: harbor.devflux.ru/playerok-devflux/backend-prod:1
          imagePullPolicy: Always
          command: ["/opt/venv/bin/python", "-m", "backend_app.workers.email_worker"]
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: playerok-secrets
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: email-worker-metrics
  labels:
    app: email-worker
    environment: prod
    component: worker
    monitoring.devflux.io/enabled: "true"
spec:
  selector:
    app: email-worker
    environment: prod
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
