apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrations
  labels:
    app: backend
    environment: prod
    component: migrations
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: backend
        environment: prod
        component: migrations
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend-migrations
          image: harbor.devflux.ru/playerok-devflux/backend-prod:v0.46.5-build.20-sha.534ca8801dbc
          imagePullPolicy: Always
          command: ["/opt/venv/bin/alembic"]
          args: ["upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: playerok-secrets
          env:
            # Temporary: the production S3 endpoint is unreachable from the cluster.
            # Keep the landing API startup independent from optional avatar storage.
            - name: S3_ENDPOINT_URL
              value: ""
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
