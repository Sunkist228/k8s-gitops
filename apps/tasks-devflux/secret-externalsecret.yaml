apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasks-devflux-secrets
  namespace: tasks-devflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: tasks-devflux-secrets
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: apps/tasks-devflux
        property: TELEGRAM_BOT_TOKEN
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: apps/tasks-devflux
        property: OPENROUTER_API_KEY
    - secretKey: OPENROUTER_MODEL
      remoteRef:
        key: apps/tasks-devflux
        property: OPENROUTER_MODEL
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/tasks-devflux
        property: DATABASE_URL
    - secretKey: ADMIN_CHAT_ID
      remoteRef:
        key: apps/tasks-devflux
        property: ADMIN_CHAT_ID