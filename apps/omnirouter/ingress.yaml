apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnirouter-ingress
  namespace: omnirouter
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: omnirouter-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - OmniRouter'
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
  - hosts:
    - omnirouter.devflux.ru
    secretName: omnirouter-tls
  rules:
  - host: omnirouter.devflux.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: omnirouter
            port:
              number: 20129
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnirouter-api-ingress
  namespace: omnirouter
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
  - hosts:
    - api.omnirouter.devflux.ru
    secretName: omnirouter-api-tls
  rules:
  - host: api.omnirouter.devflux.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: omnirouter
            port:
              number: 20128
