apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnirouter
  namespace: omnirouter
  labels:
    app: omnirouter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnirouter
  template:
    metadata:
      labels:
        app: omnirouter
    spec:
      initContainers:
      - name: install-omniroute
        image: node:22-alpine
        command:
          - /bin/sh
          - -c
          - |
            npm install -g omniroute@latest
            ls -la /usr/local/lib/node_modules/omniroute/
            echo "Installation complete"
        volumeMounts:
        - name: npm-cache
          mountPath: /usr/local/lib/node_modules
      containers:
      - name: omnirouter
        image: node:22-alpine
        command:
          - /bin/sh
          - -c
          - |
            if [ -d /usr/local/lib/node_modules/omniroute ]; then
              exec node /usr/local/lib/node_modules/omniroute/dist/index.js --no-open
            else
              echo "omniroute not found in /usr/local/lib/node_modules/"
              exit 1
            fi
        ports:
        - name: api
          containerPort: 20128
          protocol: TCP
        - name: dashboard
          containerPort: 20129
          protocol: TCP
        env:
        - name: OMNIROUTE_MEMORY_MB
          valueFrom:
            secretKeyRef:
              name: omnirouter-env
              key: OMNIROUTE_MEMORY_MB
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: npm-cache
        emptyDir: {}
