apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnirouter
  namespace: omnirouter
  labels:
    app: omnirouter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnirouter
  template:
    metadata:
      labels:
        app: omnirouter
    spec:
      containers:
      - name: omnirouter
        image: node:20-alpine
        command:
          - /bin/sh
          - -c
          - |
            npm install -g omnirouter@latest
            exec npx omniroute --no-open
        ports:
        - name: api
          containerPort: 20128
          protocol: TCP
        - name: dashboard
          containerPort: 20129
          protocol: TCP
        env:
        - name: OMNIROUTE_MEMORY_MB
          valueFrom:
            secretKeyRef:
              name: omnirouter-env
              key: OMNIROUTE_MEMORY_MB
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
