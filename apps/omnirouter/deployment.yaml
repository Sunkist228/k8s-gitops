apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnirouter
  namespace: omnirouter
  labels:
    app: omnirouter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnirouter
  template:
    metadata:
      labels:
        app: omnirouter
    spec:
      initContainers:
      - name: install-omniroute
        image: node:22-alpine
        env:
        - name: NPM_CONFIG_PREFIX
          value: /opt/npm-global
        command:
          - /bin/sh
          - -c
          - |
            npm install -g omniroute@latest
            ls -la /opt/npm-global/lib/node_modules/omniroute/
            echo "Installation complete"
        volumeMounts:
        - name: npm-cache
          mountPath: /opt/npm-global
      containers:
      - name: omnirouter
        image: node:22-alpine
        command:
          - /bin/sh
          - -c
          - |
            APP_DIR=/opt/npm-global/lib/node_modules/omniroute/app
            if [ -f "$APP_DIR/server.js" ]; then
              cd "$APP_DIR"
              export HOSTNAME=0.0.0.0
              export OMNIROUTE_PORT=20128
              export API_PORT=20128
              export DASHBOARD_PORT=20129
              export PORT=20129
              export NODE_ENV=production
              exec node --max-old-space-size="${OMNIROUTE_MEMORY_MB:-512}" server.js
            else
              echo "omniroute server.js not found at $APP_DIR"
              exit 1
            fi
        ports:
        - name: dashboard
          containerPort: 20129
          protocol: TCP
        env:
        - name: OMNIROUTE_MEMORY_MB
          valueFrom:
            secretKeyRef:
              name: omnirouter-env
              key: OMNIROUTE_MEMORY_MB
        volumeMounts:
        - name: npm-cache
          mountPath: /opt/npm-global
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      - name: api-forwarder
        image: alpine/socat:latest
        command:
          - /bin/sh
          - -c
          - |
            exec socat TCP-LISTEN:20128,bind="${POD_IP}",fork,reuseaddr TCP:127.0.0.1:20128
        ports:
        - name: api
          containerPort: 20128
          protocol: TCP
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: npm-cache
        emptyDir: {}
