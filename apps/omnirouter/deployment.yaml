apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnirouter
  namespace: omnirouter
  labels:
    app: omnirouter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnirouter
  template:
    metadata:
      labels:
        app: omnirouter
    spec:
      containers:
      - name: omnirouter
        image: node:20-alpine
        command:
          - /bin/sh
          - -c
          - |
            set -x
            npm install -g omnirouter@latest
            NPM_BIN=$(npm root -g)
            echo "NPM_BIN=$NPM_BIN"
            ls -la "$NPM_BIN/" || true
            ls -la "$NPM_BIN/omnirouter/" || true

            if [ -f "$NPM_BIN/omnirouter/dist/index.js" ]; then
              echo "Found: $NPM_BIN/omnirouter/dist/index.js"
              exec node "$NPM_BIN/omnirouter/dist/index.js" --no-open
            elif [ -f "$NPM_BIN/omnirouter/index.js" ]; then
              echo "Found: $NPM_BIN/omnirouter/index.js"
              exec node "$NPM_BIN/omnirouter/index.js" --no-open
            else
              echo "ERROR: Cannot find omnirouter entry point"
              echo "Searching for omnirouter files:"
              find "$NPM_BIN" -name "*omnirouter*" -o -name "index.js" | head -20
              sleep 30
              exit 1
            fi
        ports:
        - name: api
          containerPort: 20128
          protocol: TCP
        - name: dashboard
          containerPort: 20129
          protocol: TCP
        env:
        - name: OMNIROUTE_MEMORY_MB
          valueFrom:
            secretKeyRef:
              name: omnirouter-env
              key: OMNIROUTE_MEMORY_MB
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: dashboard
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
