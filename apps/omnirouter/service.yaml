apiVersion: v1
kind: Service
metadata:
  name: omnirouter
  namespace: omnirouter
  labels:
    app: omnirouter
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 20128
    targetPort: api
    protocol: TCP
  - name: dashboard
    port: 20129
    targetPort: dashboard
    protocol: TCP
  selector:
    app: omnirouter
