apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: artifact-server
  labels:
    app: artifact-server
    component: artifacts
    environment: prod
spec:
  selector:
    matchLabels:
      app: artifact-server
      environment: prod
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
