apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: omnirouter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Sunkist228/k8s-gitops.git
    targetRevision: HEAD
    path: apps/omnirouter
  destination:
    server: https://kubernetes.default.svc
    namespace: omnirouter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
