apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-devops-tools-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: devops-tools
    ports:
    - protocol: TCP
      port: 5432
