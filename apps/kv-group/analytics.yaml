apiVersion: v1
kind: Service
metadata:
  name: kv-group-analytics
  labels:
    app.kubernetes.io/name: kv-group-analytics
spec:
  selector:
    app.kubernetes.io/name: kv-group-analytics
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-group-analytics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-group-analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-group-analytics
        app.kubernetes.io/part-of: kv-group
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: metrics
          image: harbor.devflux.ru/kv-group/api:latest
          command: ["uvicorn", "app.analytics_exporter:app", "--host", "0.0.0.0", "--port", "9108"]
          ports:
            - name: metrics
              containerPort: 9108
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: DATABASE_URL
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kv-group-analytics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kv-group-analytics
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9108
