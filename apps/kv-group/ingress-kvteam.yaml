apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kvteam
  labels:
    app.kubernetes.io/name: kv-group
    app.kubernetes.io/part-of: kv-group
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: public
  rules:
    - host: kvteam.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kv-group-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: kv-group-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kv-group-web
                port:
                  number: 3000
    - host: www.kvteam.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kv-group-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: kv-group-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kv-group-web
                port:
                  number: 3000
  tls:
    - hosts:
        - kvteam.ru
        - www.kvteam.ru
      secretName: kvteam-ru-tls
