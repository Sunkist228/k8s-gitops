apiVersion: v1
kind: Service
metadata:
  name: kv-group-api
  labels:
    app.kubernetes.io/name: kv-group-api
    app.kubernetes.io/part-of: kv-group
spec:
  selector:
    app.kubernetes.io/name: kv-group-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kv-group-api-storage
  labels:
    app.kubernetes.io/name: kv-group-api
    app.kubernetes.io/part-of: kv-group
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-group-api
  labels:
    app.kubernetes.io/name: kv-group-api
    app.kubernetes.io/part-of: kv-group
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-group-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-group-api
        app.kubernetes.io/part-of: kv-group
    spec:
      imagePullSecrets:
        - name: harbor-registry
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h kv-group-postgres -U kv_group -d kv_group; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: api
          image: harbor.devflux.ru/kv-group/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: ENABLE_STARTUP_SEED
              value: "true"
            - name: STORAGE_DIRECTORY
              value: /app/storage
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: DATABASE_URL
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: TELEGRAM_CHAT_ID
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: api-storage
              mountPath: /app/storage
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: kv-group-api-storage
