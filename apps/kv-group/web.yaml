apiVersion: v1
kind: Service
metadata:
  name: kv-group-web
  labels:
    app.kubernetes.io/name: kv-group-web
    app.kubernetes.io/part-of: kv-group
spec:
  selector:
    app.kubernetes.io/name: kv-group-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-group-web
  labels:
    app.kubernetes.io/name: kv-group-web
    app.kubernetes.io/part-of: kv-group
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-group-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-group-web
        app.kubernetes.io/part-of: kv-group
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: web
          image: harbor.devflux.ru/kv-group/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: ""
            - name: API_INTERNAL_URL
              value: http://kv-group-api:8000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
