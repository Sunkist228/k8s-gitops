apiVersion: v1
kind: Service
metadata:
  name: kv-group-postgres
  labels:
    app.kubernetes.io/name: kv-group-postgres
    app.kubernetes.io/part-of: kv-group
spec:
  selector:
    app.kubernetes.io/name: kv-group-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kv-group-postgres-data
  labels:
    app.kubernetes.io/name: kv-group-postgres
    app.kubernetes.io/part-of: kv-group
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kv-group-postgres
  labels:
    app.kubernetes.io/name: kv-group-postgres
    app.kubernetes.io/part-of: kv-group
spec:
  serviceName: kv-group-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-group-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-group-postgres
        app.kubernetes.io/part-of: kv-group
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kv_group
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kv_group
                - -d
                - kv_group
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - kv_group
                - -d
                - kv_group
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: kv-group-postgres-data
