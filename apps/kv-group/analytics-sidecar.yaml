apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-group-api
spec:
  template:
    spec:
      containers:
        - name: metrics
          image: harbor.devflux.ru/kv-group/api:latest
          command: ["uvicorn", "app.analytics_exporter:app", "--host", "0.0.0.0", "--port", "9108"]
          ports:
            - name: metrics
              containerPort: 9108
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kv-group-secrets
                  key: DATABASE_URL
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on"
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
