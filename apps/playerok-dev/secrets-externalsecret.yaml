apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playerok-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: playerok-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: JWT_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: playerok-dev/playerok
        property: DATABASE_URL
    - secretKey: TOTP_ISSUER
      remoteRef:
        key: playerok-dev/playerok
        property: TOTP_ISSUER
    - secretKey: TOTP_ENCRYPTION_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: TOTP_ENCRYPTION_KEY
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: playerok-dev/playerok
        property: S3_ENDPOINT_URL
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: S3_SECRET_KEY
    - secretKey: S3_AVATAR_BUCKET
      remoteRef:
        key: playerok-dev/playerok
        property: S3_AVATAR_BUCKET
    - secretKey: S3_AVATAR_PUBLIC_BASE_URL
      remoteRef:
        key: playerok-dev/playerok
        property: S3_AVATAR_PUBLIC_BASE_URL
    - secretKey: FRONTEND_URL
      remoteRef:
        key: playerok-dev/playerok
        property: FRONTEND_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: playerok-dev/playerok
        property: HARBOR_DOCKERCONFIGJSON
