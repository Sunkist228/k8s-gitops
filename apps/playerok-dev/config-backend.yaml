apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    environment: dev
    component: api
data:
  AUTO_CREATE_TABLES: "true"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRES_MINUTES: "30"
  REFRESH_TOKEN_EXPIRES_DAYS: "7"
  DB_CONNECT_RETRIES: "10"
  DB_CONNECT_DELAY_SECONDS: "2"
  ENVIRONMENT: "dev"
  FRONTEND_URL: "https://dev.devflux.ru"
  BACKEND_PUBLIC_URL: "https://api.dev.devflux.ru"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  EMAIL_VERIFICATION_REQUIRED: "true"
  MAIL_FROM_EMAIL: "noreply@devflux.ru"
  MAIL_FROM_NAME: "Devflux"
  MAIL_DRY_RUN: "false"
  SMTP_HOST: "mail-stalwart.mail.svc.cluster.local"
  SMTP_PORT: "465"
  SMTP_USE_SSL: "true"
  SMTP_USE_TLS: "false"
