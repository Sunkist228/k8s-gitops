apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    environment: dev
    component: api
data:
  AUTO_CREATE_TABLES: "true"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRES_MINUTES: "30"
  REFRESH_TOKEN_EXPIRES_DAYS: "7"
  DB_CONNECT_RETRIES: "10"
  DB_CONNECT_DELAY_SECONDS: "2"
  ENVIRONMENT: "dev"
  FRONTEND_URL: "https://dev.devflux.ru"
  BACKEND_PUBLIC_URL: "https://dev.devflux.ru"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  EMAIL_VERIFICATION_REQUIRED: "true"
  EMAIL_CODE_TTL_MINUTES: "15"
  EMAIL_RESEND_COOLDOWN_SECONDS: "60"
  EMAIL_DAILY_LIMIT: "250"
  EMAIL_USER_HOURLY_LIMIT: "5"
  EMAIL_USER_DAILY_LIMIT: "10"
  EMAIL_IP_HOURLY_LIMIT: "20"
  EMAIL_IP_DAILY_LIMIT: "50"
  EMAIL_WORKER_POLL_SECONDS: "2"
  EMAIL_WORKER_MAX_ATTEMPTS: "5"
  EMAIL_WORKER_RETRY_BASE_SECONDS: "60"
  EMAIL_WORKER_CLAIM_TIMEOUT_SECONDS: "300"
  EMAIL_WORKER_HEARTBEAT_TTL_SECONDS: "30"
  EMAIL_WORKER_METRICS_PORT: "9101"
  MAIL_FROM_EMAIL: "noreply@devflux.ru"
  MAIL_FROM_NAME: "Devflux"
  MAIL_DRY_RUN: "false"
  EMAIL_BRAND_LOGO_URL: "https://dev.devflux.ru/devflux-mail-logo.png"
  EMAIL_BIMI_SELECTOR: "default"
  SMTP_PORT: "587"
  SMTP_USE_SSL: "false"
  SMTP_USE_TLS: "true"
