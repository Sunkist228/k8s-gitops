apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    environment: dev
    component: api
data:
  AUTO_CREATE_TABLES: "true"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRES_MINUTES: "30"
  REFRESH_TOKEN_EXPIRES_DAYS: "7"
  DB_CONNECT_RETRIES: "10"
  DB_CONNECT_DELAY_SECONDS: "2"
  ENVIRONMENT: "dev"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
