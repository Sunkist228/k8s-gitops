apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-server-config
  labels:
    app: artifact-server
    environment: dev
    component: artifacts
data:
  AUTO_CREATE_TABLES: "true"
  S3_ARTIFACT_BUCKET: "playerok-artifacts"
  S3_REGION: "us-east-1"
  S3_PUBLIC_ENDPOINT_URL: "https://minio.s3.devflux.ru"
  S3_PRESIGNED_DOWNLOAD_TTL_SECONDS: "600"
  ARTIFACT_CDN_BASE_URL: "https://cdn.dev.devflux.ru/cdn/artifacts"
  ARTIFACT_CDN_CACHE_SECONDS: "86400"
  PUBLIC_BASE_URL: "https://dev.devflux.ru/api/artifacts"
  REDIS_URL: "redis://redis.playerok-dev.svc.cluster.local:6379/0"
  REDIS_ENABLED: "true"
  MAX_UPLOAD_SIZE_BYTES: "524288000"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
