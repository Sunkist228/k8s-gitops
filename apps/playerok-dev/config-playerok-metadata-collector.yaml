apiVersion: v1
kind: ConfigMap
metadata:
  name: playerok-metadata-collector
  labels:
    app: playerok-metadata-collector
    environment: dev
    component: worker
data:
  BACKEND_URL: "http://backend.playerok-dev.svc.cluster.local:8000"
  PLAYEROK_METADATA_LOCALE: "ru"
  PLAYEROK_METADATA_INTERVAL_SECONDS: "3600"
  PLAYEROK_METADATA_PRIORITY_POLL_SECONDS: "15"
  PLAYEROK_METADATA_CATALOG_TTL_SECONDS: "3600"
  PLAYEROK_METADATA_SCHEMA_TTL_SECONDS: "21600"
  PLAYEROK_METADATA_SCHEMA_CONTRACT_VERSION: "1"
  PLAYEROK_METADATA_RATE_LIMIT_PER_SECOND: "1"
  PLAYEROK_METADATA_MAX_CONCURRENCY: "1"
  PLAYEROK_METADATA_MAX_ATTEMPTS: "4"
  PLAYEROK_METADATA_BACKOFF_BASE_SECONDS: "1"
  PLAYEROK_METADATA_JITTER_SECONDS: "0.5"
  PLAYEROK_METADATA_METRICS_PORT: "9102"
