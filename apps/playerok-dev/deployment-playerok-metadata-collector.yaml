apiVersion: apps/v1
kind: Deployment
metadata:
  name: playerok-metadata-collector
  labels:
    app: playerok-metadata-collector
    environment: dev
    component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playerok-metadata-collector
      environment: dev
  template:
    metadata:
      labels:
        app: playerok-metadata-collector
        environment: dev
        component: worker
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: playerok-metadata-collector
          image: harbor.devflux.ru/playerok-devflux/playerok-metadata-collector-dev:v0.59.0-dev.574-sha.d6ee894bb193
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: playerok-metadata-collector
            - secretRef:
                name: playerok-metadata-collector
          volumeMounts:
            - name: tls-runtime
              mountPath: /opt/venv/lib/python3.12/site-packages/tls_requests/bin
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 500m
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tls-runtime
          emptyDir:
            sizeLimit: 64Mi
