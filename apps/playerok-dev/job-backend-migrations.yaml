apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrations
  labels:
    app: backend
    environment: dev
    component: migrations
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: backend
        environment: dev
        component: migrations
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend-migrations
          image: harbor.devflux.ru/playerok-devflux/backend-dev:v0.59.0-dev.574-sha.d6ee894bb193
          imagePullPolicy: Always
          command: ["/opt/venv/bin/alembic"]
          args: ["upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: playerok-secrets
            - secretRef:
                name: playerok-metadata-backend
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
