apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifact-server-secrets
spec:
  refreshInterval: 2m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: artifact-server-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: JWT_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: playerok-dev/playerok
        property: ARTIFACT_DATABASE_URL
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: playerok-dev/playerok
        property: S3_ENDPOINT_URL
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: playerok-dev/playerok
        property: S3_SECRET_KEY
