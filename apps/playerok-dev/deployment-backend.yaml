apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    environment: dev
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      environment: dev
  template:
    metadata:
      annotations:
        backend.devflux.ru/config-revision: "2026-06-10-playerok-dev-public-url"
      labels:
        app: backend
        environment: dev
        component: api
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: harbor.devflux.ru/playerok-devflux/backend-dev:v0.58.0-dev.570-sha.da6f5f249846
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: playerok-secrets
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 35
            periodSeconds: 5
