apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-server
  labels:
    app: artifact-server
    environment: dev
    component: artifacts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-server
      environment: dev
  template:
    metadata:
      annotations:
        artifact-server.devflux.ru/config-revision: "2026-08-14-cdn-origin"
      labels:
        app: artifact-server
        environment: dev
        component: artifacts
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: artifact-server
          image: harbor.devflux.ru/playerok-devflux/artifact-server-dev:v0.45.0-dev.423-sha.2fe6a47676d3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: artifact-server-config
            - secretRef:
                name: artifact-server-secrets
          env:
            - name: CDN_ORIGIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: artifact-server-secrets
                  key: CDN_ORIGIN_SECRET
                  optional: false
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
